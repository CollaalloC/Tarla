[package]
name = "tarlad"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
fs2="0.4"
hmac="0.12"
tempfile.workspace = true
reqwest = {version="0.12", default-features=false, features=["json","rustls-tls","socks"]}
rusqlite.workspace = true
serde = { version = "1", features=["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = {version="1",features=["full"]}
toml = "0.8"
uuid.workspace = true
tarla-workspace = {path="../tarla-workspace"}
tarla-protocol = {path="../tarla-protocol"}
tarla-context = {path="../tarla-context"}
tarla-memory = {path="../tarla-memory"}
tarla-supervisor = {path="../tarla-supervisor"}
tarla-scheduler = {path="../tarla-scheduler"}
tarla-sidecar = {path="../tarla-sidecar"}
tarla-gateway = {path="../tarla-gateway"}
tarla-botflow = {path="../tarla-botflow"}
tokio-tungstenite = {version="0.28", default-features=false, features=["handshake"]}

[target.'cfg(unix)'.dependencies]
libc = "0.2"
