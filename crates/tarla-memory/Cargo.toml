[package]
name = "tarla-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
reqwest.workspace = true
tokio.workspace = true

[dev-dependencies]
axum = "0.8"
