name: Check Tarla
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install pinned Herdr release
        id: herdr_release
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python3 tests/install_test_herdr.py "$GITHUB_ENV"
      - name: Fetch Herdr release sources when the binary mirror is unavailable
        if: runner.os == 'Linux' && steps.herdr_release.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr-core
          ref: 06793ede1bedb1fed8d22d3cae476d3eb239edf0
          submodules: true
          persist-credentials: false
          path: .upstream-herdr
      - if: runner.os == 'Linux' && steps.herdr_release.outcome == 'failure'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Build the exact upstream Herdr release
        if: runner.os == 'Linux' && steps.herdr_release.outcome == 'failure'
        working-directory: .upstream-herdr
        run: |
          cargo build --locked -p herdr-core
          echo "TARLA_TEST_HC=$PWD/target/debug/herdr-core" >> "$GITHUB_ENV"
          echo "TARLA_TEST_HERDR=$PWD/target/debug/herdr-core" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: python3 tests/install_test_networks.py "$GITHUB_ENV"
      - name: Build daemon and CLI for acceptance
        if: runner.os == 'Linux'
        id: binaries
        run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Upstream terminal and network adapters
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: cargo test --locked -p tarla-sidecar --test real -- --ignored
      - name: Single-node supervisor, execution, receipt and host isolation
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/stage1_core.py
      - name: Long conversations, exact recall and budgeted packets
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/stage1_history.py
      - name: Executor recovery, cancellation and account ownership
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/executor_recovery.py
      - name: Direct and supervisor-routed terminal sessions
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/stage3_terminal.py
      - name: Framed terminal observer
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: cargo test --locked -p tarlad private_observer_streams -- --ignored
      - name: Cross-node recovery and terminal grants
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/acceptance.py
      - name: Atomic dispatch, reviewer provenance and independent receipt delivery
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/dispatch_recovery.py
      - name: Signed supervisor recovery and retirement
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/authority_recovery.py
      - name: Cross-node claim and acknowledged event recovery
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/s1_reconciliation.py
      - name: Durable S2 fork recovery
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/s2_recovery.py
      - name: Automatic completion lesson and offline mirror
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/stage2_distillation.py
      - name: Three network-isolated hosts with a partitioned mirror
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: sudo --preserve-env=TARLA_TEST_HC unshare --mount --net --propagation private python3 tests/stage2_network_hosts.py
      - name: Workspace skill activation
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/skills.py
      - name: Stage two scheduler and rate-limit handoff
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: |
          python3 tests/stage2_scheduler.py
          python3 tests/quota_handoff.py
      - name: Pinned sessions and handoff
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/pinned.py
      - name: Isolated EasyTier mesh
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/mesh_acceptance.py
      - name: Self-hosted Tailscale mesh
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/tailnet_acceptance.py
      - name: Fragmented model replies and authenticated IM drafts
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: |
          python3 tests/draft_stream.py
          python3 tests/gateway_stream.py
          python3 tests/gateway_recovery.py
      - name: S2 visibility and completion receipt latency
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/replication_latency.py --samples 5 --warmup 2 --jitter-ms 50 --receipt-samples 2 --successful-receipts
      - name: V2.0 event microkernel, botflow orchestration, sync ledger and safety guardrails
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: python3 tests/v2_botflow_e2e.py
      - name: Rebuild and query the Mnemosyne index with its published SDK
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: |
          python3 -m venv "$RUNNER_TEMP/mnemosyne"
          "$RUNNER_TEMP/mnemosyne/bin/python" -m pip install mnemosyne-memory==4.0.0
          TARLA_MNEMOSYNE_PYTHON="$RUNNER_TEMP/mnemosyne/bin/python" cargo test --locked -p tarla-memory real_mnemosyne -- --ignored
