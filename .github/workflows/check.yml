name: Check Tarla
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: python3 tests/install_test_herdr.py "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        run: cargo test --locked -p tarla-sidecar --test real herdr -- --ignored
      - if: runner.os == 'Linux'
        run: cargo build --workspace --locked && python3 tests/acceptance.py
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tarla-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
