name: Check Tarla
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: |
          python3 tests/install_test_herdr.py "$GITHUB_ENV"
          python3 tests/install_test_networks.py "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        run: cargo test --locked -p tarla-sidecar --test real -- --ignored
      - if: runner.os == 'Linux'
        run: cargo test --locked -p tarlad private_observer_streams -- --ignored
      - if: runner.os == 'Linux'
        run: cargo build --workspace --locked && python3 tests/acceptance.py && python3 tests/mesh_acceptance.py
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tarla-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
