name: Flutter native builds
on:
  push:
    paths:
      - "apps/tarla-app/**"
      - "crates/**"
      - "Cargo.*"
      - "tests/native_mobile.py"
      - "tests/acceptance.py"
      - "tests/install_test_herdr.py"
      - ".github/workflows/flutter-platforms.yml"
  pull_request:
    paths:
      - "apps/tarla-app/**"
      - "crates/**"
      - "Cargo.*"
      - "tests/native_mobile.py"
      - "tests/acceptance.py"
      - "tests/install_test_herdr.py"
      - ".github/workflows/flutter-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
            args: apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - target: ios-simulator
            runner: macos-15
            args: ios --simulator --debug --no-codesign
            artifact: build/ios/iphonesimulator/Runner.app
          - target: macos
            runner: macos-15
            args: macos --debug
            artifact: build/macos/Build/Products/Debug/*.app
          - target: linux
            runner: ubuntu-24.04
            args: linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            runner: windows-2022
            args: windows --release
            artifact: build/windows/x64/runner/Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/tarla-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Resolve Flutter build plugins from their published repositories
        if: matrix.target == 'android'
        shell: bash
        run: |
          gradle_home="$RUNNER_TEMP/tarla-gradle"
          mkdir -p "$gradle_home/init.d"
          cat > "$gradle_home/init.d/flutter-repositories.gradle" <<'GRADLE'
          beforeSettings { settings ->
              if (settings.settingsDir.name == 'gradle' && settings.settingsDir.parentFile.name == 'flutter_tools') {
                  settings.pluginManagement.repositories {
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          GRADLE
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Record resolved dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            git diff --exit-code -- pubspec.lock
          else
            cat pubspec.lock
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'linux'
      - name: Build daemon for client contract test
        if: matrix.target == 'linux'
        working-directory: .
        run: cargo build --locked -p tarla-cli -p tarlad
      - name: Exercise the client against the daemon
        if: matrix.target == 'linux'
        env:
          TARLA_TEST_BIN: ${{ github.workspace }}/target/debug
        run: flutter test test/daemon_contract_test.dart
      - run: flutter build ${{ matrix.args }}
      - name: Preserve bundle permissions
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: tarla-${{ matrix.target }}
          path: apps/tarla-app/${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tarla-windows
          path: apps/tarla-app/${{ matrix.artifact }}
          if-no-files-found: error

  mobile-integration:
    name: ${{ matrix.name }} · workspace and remote terminal
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android API 35
            os: ubuntu-24.04
            platform: android
          - name: iPhone Simulator
            os: macos-15
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-mobile-host
      - name: Build real host supervisor and executor
        run: cargo build --locked -p tarlad -p tarla-cli
      - name: Install the verified Linux PTY release
        id: herdr_release
        if: matrix.platform == 'android'
        continue-on-error: true
        run: python3 tests/install_test_herdr.py "$GITHUB_ENV"
      - name: Fetch pinned PTY sources for this host
        if: matrix.platform == 'ios' || steps.herdr_release.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr-core
          ref: 06793ede1bedb1fed8d22d3cae476d3eb239edf0
          submodules: true
          persist-credentials: false
          path: .upstream-herdr
      - if: matrix.platform == 'ios' || steps.herdr_release.outcome == 'failure'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Build the pinned upstream PTY executable
        if: matrix.platform == 'ios' || steps.herdr_release.outcome == 'failure'
        working-directory: .upstream-herdr
        run: |
          cargo build --locked -p herdr-core
          echo "TARLA_TEST_HC=$PWD/target/debug/herdr-core" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Resolve mobile integration dependencies
        working-directory: apps/tarla-app
        run: flutter pub get --enforce-lockfile
      - name: Enable Android emulator acceleration
        if: matrix.platform == 'android'
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Exercise both app processes on Android
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 4096M
          ram-size: 2048M
          script: python3 tests/native_mobile.py android "$(adb get-serialno)"
      - name: Exercise both app processes on iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,devices in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          python3 tests/native_mobile.py ios "$device_id"
