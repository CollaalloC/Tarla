name: Flutter native builds
on:
  push:
    paths:
      - "apps/tarla-app/**"
      - ".github/workflows/flutter-platforms.yml"
  pull_request:
    paths:
      - "apps/tarla-app/**"
      - ".github/workflows/flutter-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
            args: apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - target: ios-simulator
            runner: macos-15
            args: ios --simulator --debug --no-codesign
            artifact: build/ios/iphonesimulator/Runner.app
          - target: macos
            runner: macos-15
            args: macos --debug
            artifact: build/macos/Build/Products/Debug/*.app
          - target: linux
            runner: ubuntu-24.04
            args: linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            runner: windows-2022
            args: windows --release
            artifact: build/windows/x64/runner/Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/tarla-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Resolve Flutter build plugins from their published repositories
        if: matrix.target == 'android'
        shell: bash
        run: |
          gradle_home="$RUNNER_TEMP/tarla-gradle"
          mkdir -p "$gradle_home/init.d"
          cat > "$gradle_home/init.d/flutter-repositories.gradle" <<'GRADLE'
          beforeSettings { settings ->
              if (settings.settingsDir.name == 'gradle' && settings.settingsDir.parentFile.name == 'flutter_tools') {
                  settings.pluginManagement.repositories {
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          GRADLE
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Record resolved dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            git diff --exit-code -- pubspec.lock
          else
            cat pubspec.lock
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'linux'
      - name: Build daemon for client contract test
        if: matrix.target == 'linux'
        working-directory: .
        run: cargo build --locked -p tarla-cli -p tarlad
      - name: Exercise the client against the daemon
        if: matrix.target == 'linux'
        env:
          TARLA_TEST_BIN: ${{ github.workspace }}/target/debug
        run: flutter test test/daemon_contract_test.dart
      - run: flutter build ${{ matrix.args }}
      - name: Boot an iPhone simulator and launch Tarla
        if: matrix.target == 'ios-simulator'
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for os,devices in json.load(sys.stdin)["devices"].items() if "iOS" in os for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device_id" dev.tarla.client
          xcrun simctl terminate "$device_id" dev.tarla.client
      - name: Preserve bundle permissions
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: tarla-${{ matrix.target }}
          path: apps/tarla-app/${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tarla-windows
          path: apps/tarla-app/${{ matrix.artifact }}
          if-no-files-found: error

  android-emulator:
    name: Android API 35 launch
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarla-android
      - name: Extract the tested APK
        run: tar -xzf android.tar.gz build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable Android emulator acceleration
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Launch Tarla on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n dev.tarla.client/.MainActivity
            adb shell pidof dev.tarla.client
